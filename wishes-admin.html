<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Admin — Lời chúc | Thành Trung & Nhật Trang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7efed;--paper:#fffdfb;--ink:#463438;--muted:#92757c;
  --rose:#b86b78;--rose-dark:#704951;--line:rgba(112,73,81,.14);
  --green:#587665;--red:#a0525d;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#fffaf8,#f3dfdc);color:var(--ink);font-family:"Montserrat",Arial,sans-serif}
header{padding:28px 5vw 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.kicker{font-size:10px;letter-spacing:.32em;color:var(--rose);font-weight:600}
h1{font:500 clamp(30px,4vw,48px)/1 "Cormorant Garamond",Georgia,serif;margin:8px 0 0}
.sub{font-size:11px;color:var(--muted);margin-top:8px}
button{border:0;border-radius:12px;padding:11px 16px;font:600 11px "Montserrat";cursor:pointer}
.btn{background:var(--rose);color:white}.btn2{background:#fff;border:1px solid var(--line);color:var(--rose-dark)}
main{max-width:1200px;margin:0 auto;padding:0 5vw 50px}
.login,.wish{background:rgba(255,253,251,.9);border:1px solid var(--line);border-radius:22px;box-shadow:0 15px 45px rgba(85,50,58,.08)}
.login{max-width:520px;margin:40px auto;padding:30px}
label{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);margin:15px 0 7px;text-transform:uppercase}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:12px 13px;font:14px/1.45 "Montserrat";outline:none}
textarea{min-height:125px;resize:vertical}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}
.stats{font-size:11px;color:var(--muted)}
.list{display:grid;gap:16px}
.wish{padding:20px}
.wish-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.name{font:600 20px "Cormorant Garamond",Georgia,serif}
.date{font-size:9px;color:var(--muted)}
.badge{padding:6px 9px;border-radius:99px;font-size:9px;font-weight:600}
.badge.pending{background:#f5e7e5;color:#8d626b}.badge.approved{background:#e8f0ea;color:#4e6e5a}
.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.btn-approve{background:var(--green);color:#fff}.btn-hide{background:#f2e8e7;color:var(--red)}
.small{font-size:10px;color:var(--muted);line-height:1.5;margin-top:8px}
.error{color:#a0525d;font-size:12px;margin-top:10px}
.success{color:#587665;font-size:12px;margin-top:10px}
.empty{text-align:center;padding:50px;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker">DIGITAL GUESTBOOK · ADMIN</div>
    <h1>Những lời chúc</h1>
    <div class="sub">Thành Trung & Nhật Trang · Duyệt trước khi chiếu</div>
  </div>
  <button id="logout" class="btn2" hidden>ĐĂNG XUẤT</button>
</header>

<main>
  <section id="loginBox" class="login">
    <div class="kicker">ADMIN ACCESS</div>
    <h2 style="font:500 30px 'Cormorant Garamond';margin:8px 0">Đăng nhập quản trị</h2>
    <label>Email</label>
    <input id="email" type="email" autocomplete="username">
    <label>Mật khẩu</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="actions"><button id="login" class="btn">ĐĂNG NHẬP</button></div>
    <div id="loginMsg" class="error"></div>
    <div class="small">Tài khoản này cần được tạo thủ công trong Firebase Authentication. Trang không có chức năng đăng ký công khai.</div>
  </section>

  <section id="appBox" hidden>
    <div class="toolbar">
      <div class="stats" id="stats">Đang tải…</div>
      <button id="refresh" class="btn2">LÀM MỚI</button>
    </div>
    <div id="list" class="list"></div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,collection,query,orderBy,onSnapshot,doc,updateDoc}
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyD8Q_J2p6U6at2HeWfdc6bqEhO4AfoDy0Q",
  authDomain:"trung-trang-wedding-2027.firebaseapp.com",
  projectId:"trung-trang-wedding-2027",
  storageBucket:"trung-trang-wedding-2027.firebasestorage.app",
  messagingSenderId:"594388235466",
  appId:"1:594388235466:web:a10a124d5f07ef8f423033"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const loginBox=document.getElementById("loginBox");
const appBox=document.getElementById("appBox");
const list=document.getElementById("list");
const stats=document.getElementById("stats");
const logoutBtn=document.getElementById("logout");
const loginMsg=document.getElementById("loginMsg");
let unsub=null;

function esc(v=""){
  return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function dateOf(ts){
  if(!ts || typeof ts.toDate!=="function") return "";
  return ts.toDate().toLocaleString("vi-VN",{dateStyle:"medium",timeStyle:"short"});
}

function render(rows){
  stats.textContent=`${rows.length} lời chúc · Có thể sửa và duyệt từng lời`;
  if(!rows.length){list.innerHTML='<div class="wish empty">Chưa có lời chúc.</div>';return}
  list.innerHTML=rows.map(w=>{
    const approved=w.approved===true;
    const displayName=w.displayName ?? w.name ?? "";
    const displayMessage=w.displayMessage ?? w.message ?? "";
    return `
      <article class="wish" data-id="${esc(w.id)}">
        <div class="wish-head">
          <div>
            <div class="name">${esc(w.name||"Khách mời")}</div>
            <div class="date">${esc(dateOf(w.createdAt))}</div>
          </div>
          <span class="badge ${approved?"approved":"pending"}">${approved?"ĐÃ DUYỆT":"CHỜ DUYỆT"}</span>
        </div>
        <div class="grid">
          <div>
            <label>Tên hiển thị</label>
            <input class="displayName" value="${esc(displayName)}">
          </div>
          <div>
            <label>Lời chúc sẽ chiếu</label>
            <textarea class="displayMessage">${esc(displayMessage)}</textarea>
          </div>
        </div>
        <div class="actions">
          <button class="btn-approve" data-action="approve">${approved?"LƯU & GIỮ DUYỆT":"DUYỆT & CHO PHÉP CHIẾU"}</button>
          <button class="btn-hide" data-action="hide">ẨN / BỎ DUYỆT</button>
        </div>
        <div class="small">Nội dung khách gửi ban đầu: “${esc(w.message||"")}”</div>
        <div class="small status"></div>
      </article>`;
  });
}

function listen(){
  if(unsub) unsub();
  const q=query(collection(db,"wedding_wishes"),orderBy("createdAt","desc"));
  unsub=onSnapshot(q,snap=>{
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    render(rows);
  },err=>{
    list.innerHTML=`<div class="wish empty">Không tải được dữ liệu: ${esc(err.message)}</div>`;
  });
}

list.addEventListener("click",async e=>{
  const btn=e.target.closest("button[data-action]");
  if(!btn)return;
  const card=btn.closest(".wish");
  const id=card.dataset.id;
  const displayName=card.querySelector(".displayName").value.trim();
  const displayMessage=card.querySelector(".displayMessage").value.trim();
  const status=card.querySelector(".status");
  if(!displayName||!displayMessage){status.className="small error";status.textContent="Tên và lời chúc không được để trống.";return}
  btn.disabled=true;
  try{
    const approved=btn.dataset.action==="approve";
    await updateDoc(doc(db,"wedding_wishes",id),{
      displayName,displayMessage,approved,
      reviewedAt:new Date()
    });
    status.className="small success";
    status.textContent=approved?"Đã duyệt và đưa vào hàng chờ chiếu.":"Đã bỏ duyệt.";
  }catch(err){
    status.className="small error";
    status.textContent="Lỗi: "+err.message;
  }finally{btn.disabled=false}
});

document.getElementById("login").onclick=async()=>{
  loginMsg.textContent="";
  try{
    await signInWithEmailAndPassword(auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value);
  }catch(err){loginMsg.textContent="Đăng nhập không thành công: "+err.message}
};
logoutBtn.onclick=()=>signOut(auth);
document.getElementById("refresh").onclick=listen;

onAuthStateChanged(auth,user=>{
  const logged=!!user;
  loginBox.hidden=logged;
  appBox.hidden=!logged;
  logoutBtn.hidden=!logged;
  if(logged) listen();
  else if(unsub){unsub();unsub=null}
});
</script>
</body>
</html>
